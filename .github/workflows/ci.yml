# Integración continua (ticket H-2, restricción R-4 del PRD).
# Corre en cada cambio. Una tarea termina cuando esto está en verde en el fork.
name: Integración continua

on:
  push:
    # Solo ramas: una etiqueta con el nombre de una rama confundiría la base.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  guardarrailes:
    name: Guardarraíles (pruebas del harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: la comprobación de inmutabilidad compara con la base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # En local se probaron con 3.9, que el ejecutor ya no ofrece.
          python-version: "3.12"
      - name: El hook bloquea lo que debe y deja pasar lo que debe
        run: python3 tests/harness/prueba-datos-que-no-salen.py
      - name: El instalador instala lo que debe
        run: python3 tests/harness/prueba-instalar-guardarrailes.py
      - name: El verificador de referencias detecta lo que debe (D-91)
        run: python3 tests/harness/prueba-verificar-referencias.py
      - name: Toda referencia del repositorio resuelve y ninguna copia cambió (D-91)
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.ref_name }}
          RAMA_BASE: ${{ github.base_ref }}
          ANTES: ${{ github.event.before }}
        run: |
          # La inmutabilidad se compara con lo ya unido, no commit por commit (D-97):
          # - pull request: con su rama base;
          # - push a la rama de la entrega: con lo que había antes del push;
          # - push a cualquier otra rama: con el punto donde salió de la entrega
          #   (merge-base, D-90). Lo que la rama agregó después puede corregirse
          #   antes de unir; lo que ya estaba al salir, no.
          # Nunca se corre sin --base: si falta la referencia, el paso falla.
          ENTREGA="feature/entrega-1-JC"
          if [ "$EVENTO" = "pull_request" ]; then
            python3 scripts/verificar-referencias.py --base "origin/$RAMA_BASE"
          elif [ "$RAMA" != "$ENTREGA" ]; then
            SALIDA_DE_LA_ENTREGA="$(git merge-base "origin/$ENTREGA" HEAD)" || {
              echo "Inmutabilidad: no se halló dónde salió $RAMA de $ENTREGA (sin historia común o sin la referencia); no se puede comprobar."
              exit 1
            }
            python3 scripts/verificar-referencias.py --base "$SALIDA_DE_LA_ENTREGA"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/verificar-referencias.py --base "$ANTES"
          else
            echo "Inmutabilidad: push a $ENTREGA sin estado anterior (rama creada o recreada); no se puede comprobar."
            exit 1
          fi

  aplicacion:
    name: Aplicación (estilo, tipos, pruebas y compilación)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencias, tal como dice el fichero de bloqueo
        run: pnpm install --frozen-lockfile
      - name: Estilo
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas
        run: pnpm test
      - name: Compilación
        run: pnpm build

  base:
    name: Base de datos (migraciones, validación y comprobación de estructura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          # La misma versión con la que se probó en local.
          version: 2.109.1
      # Node y pnpm en este trabajo, no en el de la aplicación: la prueba con
      # el cliente oficial necesita la base levantada, y es este el trabajo que
      # la levanta (hallazgo F de la ronda 1 del tramo 4).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dependencias, tal como dice el fichero de bloqueo
        run: pnpm install --frozen-lockfile
      - name: Base local con las migraciones aplicadas
        run: bash scripts/base/levantar-base.sh
      - name: Los scripts de la base deciden bien (sin base)
        run: python3 tests/base/prueba-scripts-base.py
      - name: Validación 1 a 1 de cada migración
        run: python3 scripts/base/correr-validaciones.py
      - name: Comprobación de estructura (HU-03.1)
        run: python3 scripts/base/comprobar-estructura.py
      - name: La comprobación de estructura detecta lo que debe
        run: python3 tests/base/prueba-comprobacion-estructura.py
      - name: La validación de organizacion detecta lo que debe
        run: python3 tests/base/prueba-validacion-organizacion.py
      - name: Organización y sesión, con datos, por la API y por SQL
        run: python3 tests/base/prueba-acceso-organizacion.py
      - name: Usuario, su correo y su organización, con datos (HU-01.1)
        run: python3 tests/base/prueba-usuario.py
      - name: La validación de usuario detecta lo que debe
        run: python3 tests/base/prueba-validacion-usuario.py
      - name: La sesión con el pase real, cada persona ve lo suyo (HU-01.2)
        run: python3 tests/base/prueba-sesion.py
      - name: La validación de la sesión detecta lo que debe
        run: python3 tests/base/prueba-validacion-sesion.py
      - name: Cliente, asignación y aviso, con datos (HU-06.1)
        run: python3 tests/base/prueba-aviso-modelo.py
      - name: La validación del modelo del aviso detecta lo que debe
        run: python3 tests/base/prueba-validacion-aviso-modelo.py
      - name: La validación de la vigencia del pase detecta lo que debe
        run: python3 tests/base/prueba-validacion-vigencia-del-pase.py
      # La única prueba que pasa por el cliente oficial del servicio: cookies
      # reales, entrar, cerrar y reutilizar. Antes solo corría en local, así
      # que un cambio en ese cableado podía romperse con la CI en verde.
      - name: La sesión con el cliente oficial y la base local (HU-01.2)
        env:
          CT_BASE_LOCAL: "1"
          # Aquí la suite es obligatoria: si la primera variable faltara, se
          # saltaría y el trabajo saldría en verde sin haber probado nada. Con
          # esta, el caso I7 hace fallar ese verde falso.
          CT_INTEGRACION_EXIGIDA: "1"
        run: pnpm vitest run tests/integration/sesion.test.ts
