name: CI

on:
  push:
    branches: [feature/entrega-2-MVP, final-project-MVP, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=ci;password=ci;trustServerCertificate=true"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: integration (SQL Server 2022)
    runs-on: ubuntu-latest
    needs: check
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!2026"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Passw0rd!2026' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=ReconTool;user=sa;password=Ci_Passw0rd!2026;encrypt=true;trustServerCertificate=true"
      DB_HOST: localhost
      DB_PORT: "1433"
      DB_NAME: ReconTool
      DB_USER: sa
      DB_PASSWORD: "Ci_Passw0rd!2026"
      SEED_PASSWORD: "Ci_Seed!2026"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: create database
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Ci_Passw0rd!2026' -C \
            -Q "IF DB_ID('ReconTool') IS NULL CREATE DATABASE ReconTool"
      - run: pnpm db:generate
      - name: migrate + seed (proof that stage 0 is green)
        run: |
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm --filter @recon/backend test -- --project integration
        continue-on-error: true  # until integration tests exist

  security:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
