services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendaya
      POSTGRES_PASSWORD: agendaya
      POSTGRES_DB: agendaya
    ports:
      - "5432:5432"
    volumes:
      - agendaya_pgdata:/var/lib/postgresql/data

volumes:
  agendaya_pgdata:
