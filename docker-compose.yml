services:
  db:
    image: postgres:16-alpine
    container_name: firmadoc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firmadoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firmadoc}
      POSTGRES_DB: ${POSTGRES_DB:-firmadoc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - firmadoc-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firmadoc} -d ${POSTGRES_DB:-firmadoc}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  firmadoc-db-data:
