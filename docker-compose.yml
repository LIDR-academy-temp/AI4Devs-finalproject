services:
  db:
    image: postgres:16-alpine
    container_name: concilia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: concilia
      POSTGRES_PASSWORD: concilia
      POSTGRES_DB: concilia
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - concilia-pgdata:/var/lib/postgresql/data
      # Crea además la base de datos de test (concilia_test) al inicializar el volumen
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concilia -d concilia']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  concilia-pgdata:
