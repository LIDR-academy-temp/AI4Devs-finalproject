# AdOps360 — containerised monolith on a single EC2 instance.
# Four services: backend, frontend, db, nginx.
# Cognito and S3 are managed AWS services and are not part of this stack;
# only the configuration needed to reach them is declared here.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adops360

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      # AWS Cognito (User Pool) — token verification
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_REGION: ${COGNITO_REGION}

      # AWS — S3 file storage
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}

      # DSP API credentials
      ADFORM_CLIENT_ID: ${ADFORM_CLIENT_ID}
      ADFORM_CLIENT_SECRET: ${ADFORM_CLIENT_SECRET}
      EQUATIV_CLIENT_ID: ${EQUATIV_CLIENT_ID}
      EQUATIV_CLIENT_SECRET: ${EQUATIV_CLIENT_SECRET}
      DISPLAYCE_CLIENT_ID: ${DISPLAYCE_CLIENT_ID}
      DISPLAYCE_CLIENT_SECRET: ${DISPLAYCE_CLIENT_SECRET}
    networks:
      - adops360

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public Cognito settings are needed at build time by Next.js
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
        NEXT_PUBLIC_COGNITO_REGION: ${COGNITO_REGION}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      NEXT_PUBLIC_COGNITO_REGION: ${COGNITO_REGION}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks:
      - adops360

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - adops360

  # TLS certificate issuance and renewal.
  # Run on demand: docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    profiles:
      - tls

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot:

networks:
  adops360:
    driver: bridge
