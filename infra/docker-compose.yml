# Recon Tool 2.0 — SQL Server 2022 for local development.
#   docker compose -f infra/docker-compose.yml up -d
# The first start creates the ReconTool database and the application user recon_app
# (minimal permissions: db_datareader, db_datawriter, db_ddladmin for migrations).
# Never use sa from the application.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recon-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_COLLATION: Latin1_General_100_CI_AS_SC
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - recon-mssql-data:/var/opt/mssql
      - ./mssql/init.sql:/init/init.sql:ro
      - ./mssql/entrypoint.sh:/init/entrypoint.sh:ro
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: ["/bin/bash", "/init/entrypoint.sh"]

volumes:
  recon-mssql-data:
