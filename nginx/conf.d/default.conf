# Single entry point: / goes to the frontend, /api/ to the backend.
# HTTP only. The 443 server block is added on the instance once Certbot has
# issued a certificate for the real domain; nginx refuses to start if it
# references certificate files that do not exist yet.

server {
    listen 80;
    server_name _;

    # Certbot HTTP-01 challenge (docker compose run --rm certbot certonly --webroot ...).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The trailing slash on proxy_pass strips /api, so /api/health reaches the backend as /health.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
