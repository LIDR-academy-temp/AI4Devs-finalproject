schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Firmadoc, servicio de firma digital institucional (proyecto final AI4Devs).
  Fuentes de verdad, en este orden: docs/openapi.yaml (contrato de la API), readme.md
  secciones 3 (modelo de datos), 5 (historias con criterios Dado/Cuando/Entonces) y
  6 (tickets), y CLAUDE.md (stack, decisiones cerradas, comandos y convenciones).
  Stack del backend: Python 3.12+, FastAPI, SQLAlchemy 2, Alembic, Pydantic v2,
  pyHanko y pytest, sobre PostgreSQL 16 (nunca SQLite). El esquema del MVP ya existe
  (migración 0001_initial_schema) con triggers append-only en document_version y audit_event.
  Alcance actual: hito 1 (carga de PDF + firma con proveedor local + versión vigente
  descargable). Fuera de alcance: lote, FirmAR, TSA/B-LT, Web Component, OAuth2,
  reintentos de webhooks.

rules:
  proposal:
    - Referenciar el ticket del readme (sección 6) y las historias de usuario que cubre
    - Declarar explícitamente qué queda fuera de alcance
  specs:
    - Cada requirement con al menos un escenario de rechazo además del camino feliz
    - Los códigos de estado y esquemas deben coincidir con docs/openapi.yaml; si hace falta cambiarlo, decirlo en el proposal
  design:
    - No reabrir decisiones cerradas de CLAUDE.md; si una se contradice, señalarlo como riesgo
  tasks:
    - Tests primero - cada grupo empieza por los tests de integración derivados de los escenarios
    - Tareas de no más de 2 horas
    - Incluir una tarea final de documentación (readme, CLAUDE.md y prompts.md)

operations:
  apply:
    guidance:
      - Un sub-ticket por change; no mezclar trabajo de otro ticket
      - Correr pytest contra PostgreSQL real y alembic check antes de marcar tareas de modelo
