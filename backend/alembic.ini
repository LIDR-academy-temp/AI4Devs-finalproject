[alembic]
script_location = migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = consola

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = consola

[handler_consola]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s: %(message)s
