[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-track-backend"
version = "0.1.0"
description = "API y worker de Weather Track"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16,<2",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "tzdata>=2025.1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["jsonschema>=4,<5", "pytest>=8,<10", "pytest-cov>=6,<8", "pyyaml>=6,<7", "uv>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*", "herramientas*"]

[tool.setuptools.package-data]
"app.ingesta" = ["datos_simulados/*.json"]
"herramientas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
