openapi: 3.0.3
info:
  title: AgendaYa API
  version: "0.3.0"
  description: >
    Especificación formal (spec-driven) de los endpoints implementados en la Entrega 2,
    incluyendo el panel de administración del negocio (auth + CRUD de servicios y
    disponibilidad + configuración del mensaje de confirmación). Fuente de verdad para
    el contrato de la API: cualquier cambio de forma/validación en app/api/** debe
    reflejarse primero aquí. El resumen narrativo en readme.md § 4 debe mantenerse
    coherente con este archivo, no al revés.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
paths:
  /api/businesses/{businessId}/slots:
    get:
      summary: Huecos reservables de un negocio para un servicio y fecha
      description: Endpoint público, sin autenticación. Implementado en `app/api/businesses/[businessId]/slots/route.ts`.
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: serviceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", example: "2026-11-20" }
      responses:
        "200":
          description: Lista de horarios libres ese día para ese servicio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, example: "2026-11-20" }
                  serviceId: { type: string, format: uuid }
                  slots:
                    type: array
                    items: { type: string, example: "09:00" }
        "400":
          description: Parámetros inválidos (serviceId no es uuid, o date no tiene formato YYYY-MM-DD).
        "404":
          description: El servicio no existe, no está activo, o no pertenece a ese businessId.
        "429":
          description: Demasiadas solicitudes desde el mismo origen (rate limit de la Entrega 2).

  /api/appointments:
    post:
      summary: Crear una reserva de cita
      description: Endpoint público, sin autenticación. Implementado en `app/api/appointments/route.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessId, serviceId, startAt, clientName, clientPhone]
              properties:
                businessId: { type: string, format: uuid }
                serviceId: { type: string, format: uuid }
                startAt:
                  type: string
                  description: ISO 8601, con o sin offset de zona horaria.
                  example: "2026-11-20T09:30:00"
                clientName: { type: string, minLength: 1, maxLength: 120, example: "Ana Pérez" }
                clientPhone:
                  type: string
                  description: Formato internacional (E.164-like), ej. +51987654321.
                  pattern: "^\\+?[1-9]\\d{6,14}$"
                  example: "+51987654321"
      responses:
        "201":
          description: Cita creada en estado "pending".
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  businessId: { type: string, format: uuid }
                  serviceId: { type: string, format: uuid }
                  clientName: { type: string }
                  clientPhone: { type: string }
                  startAt: { type: string, format: date-time }
                  endAt: { type: string, format: date-time }
                  status: { type: string, enum: [pending, confirmed, cancelled] }
        "400":
          description: Body inválido según el esquema (Zod).
        "404":
          description: El servicio no existe, no está activo, o no pertenece a ese businessId.
        "409":
          description: El horario solicitado ya no está disponible (conflicto con otra cita, detectado dentro de una transacción Prisma).
        "429":
          description: Demasiadas solicitudes desde el mismo origen (rate limit de la Entrega 2).

  /api/businesses/{businessId}/availability:
    get:
      summary: Listar los bloques de disponibilidad del negocio
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Lista de bloques de disponibilidad. }
        "401": { description: Sin sesión de negocio válida. }
        "403": { description: La sesión no pertenece a este businessId. }
    post:
      summary: Crear un bloque de disponibilidad horaria para el negocio
      description: Requiere sesión del negocio (Auth.js). Implementado en `app/api/businesses/[businessId]/availability/route.ts`.
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dayOfWeek, startTime, endTime]
              properties:
                dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
                startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", example: "09:00" }
                endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$", example: "18:00" }
      responses:
        "201": { description: Bloque de disponibilidad creado. }
        "400": { description: "endTime <= startTime, o formato HH:mm inválido." }
        "401": { description: Sin sesión de negocio válida. }
        "403": { description: La sesión no pertenece a este businessId. }

  /api/businesses/{businessId}/availability/{availabilityId}:
    delete:
      summary: Eliminar un bloque de disponibilidad
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: availabilityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Eliminado. }
        "401": { description: Sin sesión de negocio válida. }
        "403": { description: La sesión no pertenece a este businessId. }
        "404": { description: El bloque no existe o no pertenece a este negocio. }

  /api/businesses/{businessId}/services:
    get:
      summary: Listar todos los servicios del negocio (activos e inactivos)
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Lista de servicios. }
        "401": { description: Sin sesión de negocio válida. }
        "403": { description: La sesión no pertenece a este businessId. }
    post:
      summary: Crear un servicio
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, durationMinutes, price]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                durationMinutes: { type: integer, minimum: 5, maximum: 480 }
                price: { type: number, minimum: 0 }
      responses:
        "201": { description: Servicio creado (activo por defecto). }
        "400": { description: Body inválido. }
        "401": { description: Sin sesión de negocio válida. }
        "403": { description: La sesión no pertenece a este businessId. }

  /api/businesses/{businessId}/services/{serviceId}:
    patch:
      summary: Actualizar un servicio (nombre, duración, precio, activo)
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                durationMinutes: { type: integer }
                price: { type: number }
                active: { type: boolean }
      responses:
        "200": { description: Servicio actualizado. }
        "404": { description: El servicio no existe o no pertenece a este negocio. }
    delete:
      summary: Desactivar un servicio
      description: >
        No hace un DELETE real: marca `active: false`. Un borrado físico arrastraría
        (cascade) las citas históricas ligadas a este servicio.
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: serviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Servicio desactivado. }
        "404": { description: El servicio no existe o no pertenece a este negocio. }

  /api/businesses/{businessId}:
    patch:
      summary: Actualizar la configuración del negocio (mensaje de confirmación de WhatsApp)
      security:
        - sessionAuth: []
      parameters:
        - { name: businessId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmationMessageTemplate]
              properties:
                confirmationMessageTemplate:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: "Placeholders: {{clientName}}, {{service}}, {{date}}, {{time}}, {{business}}."
      responses:
        "200": { description: Negocio actualizado. }
        "400": { description: Body inválido. }

  /api/auth/{...nextauth}:
    get:
      summary: Rutas de Auth.js (login/logout/sesión/csrf) para el panel del negocio
      description: Manejadas por `next-auth` (Credentials provider, email+password contra `Business`). No se documentan request/response aquí porque son estándar de Auth.js, no contrato propio de este proyecto.
      responses:
        "200": { description: Según la subruta de Auth.js invocada. }

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: authjs.session-token
      description: >
        Cookie de sesión JWT de Auth.js v5 (Credentials provider). Todo endpoint que la
        requiere verifica además que `session.user.businessId` coincida con el
        `businessId` de la URL (ver `lib/security/authz.ts`) — nunca confía en el
        businessId recibido del cliente.
