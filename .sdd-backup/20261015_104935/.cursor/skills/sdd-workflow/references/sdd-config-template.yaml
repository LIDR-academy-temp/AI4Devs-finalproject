# =====================================================================
# sdd.config.yaml — Plantilla para nuevos proyectos
# ---------------------------------------------------------------------
# 1. Copia este archivo a la raíz del repo (o a sdd-toolkit/) como sdd.config.yaml
# 2. Edita SOLO vars + targets + tools (+ implementer si cambia el toolchain)
# 3. Completa profiles/ a partir de las plantillas del plugin (profile-*.md)
# 4. Activa solo los targets que uses (enabled: true)
# =====================================================================

project: <nombre-del-proyecto>
owner: <email-del-responsable>
language: es

vars:
  # Rutas (Windows: barras invertidas dobles; Linux/macOS: barras normales)
  RUTA_CONTEXTOS:   '<ruta-al-repo-de-contexto>'
  RUTA_PLANNING:    '<ruta-al-repo-de-contexto>/.planning'
  RUTA_SPECS:       '<ruta-al-repo-de-contexto>/.planning'
  RUTA_GRAPH:       '<ruta-al-repo-de-contexto>/_graph.md'
  RUTA_REPO_API:    '<ruta-al-repo-de-api>'

  PROYECTO_API:     <NombreProyectoSolucion>
  NOMBRE_API:       <nombre-instancia-api>
  REPO_SQL:         <nombre-repo-sql>          # opcional si no hay target database

  DB_PRINCIPAL:     <NombreBaseDeDatos>        # opcional
  DB_SECUNDARIA:    <NombreBaseDeDatosSecundaria>  # opcional

  # Nombres de los servidores MCP configurados en el IDE/host
  MCP_TEST:         <nombre-mcp-test>          # opcional
  MCP_PROD:         <nombre-mcp-prod>          # opcional

  # Vars de clases/controllers — solo si el stack backend las necesita
  # (ejemplo .NET propietario). Omitir en otros stacks.
  # CLASE_HEADERS:    <ClaseHeaders>
  # CLASE_REQUEST:    <ClaseRequest>
  # CTR_REFERENCIA:   <ControllerDeReferencia>
  # CTR_ERROR_SQL:    <ControllerEjemploErrorSQL>
  # CTR_SWAGGER:      <ControllerEjemploSwagger>

  # Frontend React/Vite — completar si el proyecto tiene target frontend
  # RUTA_REPO_FRONT:       '<ruta-al-repo-frontend>'
  # PROYECTO_FRONT:        <NombreProyectoFront>
  # COMPONENTE_REFERENCIA: <ComponenteDeReferencia>   # componente CRUD de referencia

  # Web Legacy ASP.NET MVC 5 — completar si el proyecto tiene target web-legacy
  # RUTA_REPO_WEB_LEGACY:  '<ruta-al-repo-mvc>'
  # PROYECTO_WEB_LEGACY:   <NombreProyectoMVC>
  # CTR_REFERENCIA_MVC:    <ControllerDeReferenciaMVC>
  # CLASE_HTTP_MVC:        <ClaseWrapperHTTP>         # wrapper HTTP hacia API externa
  # CLASE_TOOLS_MVC:       <ClaseHelperUtilidades>    # helper de utilidades del proyecto

  # ASP.NET Core 8 / Razor Pages — completar si el proyecto tiene target web-core
  # RUTA_REPO_ASPNET_CORE: '<ruta-al-repo-aspnet-core>'
  # PROYECTO_ASPNET_CORE:  <NombreProyectoCore>
  # PAGE_REFERENCIA_CORE:  <PageModelDeReferencia>    # PageModel de referencia para namespace
  # CLASE_HTTP_CORE:       <ClaseWrapperHTTP>         # wrapper HTTP hacia API externa
  # CLASE_TOOLS_CORE:      <ClaseHelperUtilidades>    # helper de utilidades del proyecto

targets:

  context:
    enabled: true
    profile: ./sdd-toolkit/profiles/context.md
    instances:
      - name: <nombre-instancia-contexto>
        repo: <ruta-al-repo-de-contexto>
        specs_path: .planning
        graph: _graph.md
        planning_path: .planning
        git:
          enabled: false

  database:
    enabled: true
    profile: ./sdd-toolkit/profiles/database.md
    engine: <sqlserver|postgres|mysql|…>
    envs:
      test: { host: <host-test>, port: <puerto-test> }
      # dev:  { host: <host-dev>,  port: <puerto-dev> }
    instances:
      - name: <NombreBaseDeDatos>
        role: principal
        git:
          enabled: false
        schemas: [<esquema1>, <esquema2>]

  backend:
    enabled: true
    profile: ./sdd-toolkit/profiles/backend.md
    instances:
      - name: <nombre-instancia-api>
        stack: <dotnet|node|java|go|…>
        role: API principal
        repo: <ruta-al-repo-de-api>
        git:
          enabled: true
          base_branch: <rama-base>
          branch_format: "TKT-{id}"

  frontend:
    enabled: false
    profile: ./sdd-toolkit/profiles/frontend.md
    instances:
      # React/Vite — ver references/profile-frontend.md
      # - name: <nombre-instancia-frontend>
      #   stack: react-vite
      #   repo: <RUTA_REPO_FRONT>
      #   git:
      #     enabled: true
      #     base_branch: <rama-base>
      #     branch_format: "TKT-{id}"

      # ASP.NET MVC 5 — ver references/profile-web-legacy.md
      # - name: web-legacy
      #   stack: aspnet-mvc5
      #   profile: ./sdd-toolkit/profiles/web-legacy.md
      #   repo: <RUTA_REPO_WEB_LEGACY>
      #   git:
      #     enabled: true
      #     base_branch: master
      #     branch_format: "TKT-{id}"

      # ASP.NET Core 8 / Razor Pages — ver references/profile-web-core.md
      # - name: web-core
      #   stack: aspnet-core8
      #   profile: ./sdd-toolkit/profiles/web-core.md
      #   repo: <RUTA_REPO_ASPNET_CORE>
      #   git:
      #     enabled: true
      #     base_branch: main
      #     branch_format: "TKT-{id}"

  mobile:
    enabled: false
    profile: ./sdd-toolkit/profiles/mobile.md
    instances:
      # - name: <nombre-instancia-mobile>
      #   stack: <flutter|react-native|…>
      #   role: App móvil principal
      #   repo: <ruta-al-repo-mobile>
      #   git:
      #     enabled: true
      #     base_branch: <rama-base>
      #     branch_format: "TKT-{id}"

  integrations:
    enabled: false
    profile: ./sdd-toolkit/profiles/integrations.md
    instances: []

implementer:
  tool: cursor           # cursor | copilot | humano | …
  mode: hybrid           # hybrid | claude | cursor
                         #   hybrid: Claude planifica (spec/design), Cursor implementa
                         #   claude: Claude hace el pipeline completo
                         #   cursor: Cursor hace el pipeline completo
  rules_path: .cursor    # o .github, según toolchain
  entry_command: /ejecutar

# ---------------------------------------------------------------------
# Separación arquitecto / editor (aider pattern)
# Claude = arquitecto (spec/design en lenguaje natural)
# Cursor = editor (código exacto a partir de los artefactos)
# ---------------------------------------------------------------------
planning:
  architect_role: context-generator
  editor_role:    implementer
  model_routing:
    strong: [spec_md, design_md, delta_md]
    weak:   [_index_md, _graph_md, compound_loop]

# ---------------------------------------------------------------------
# tools — comandos opcionales del proyecto (omitir los que no existan)
# Placeholders: {tkt} {date} {query}
# ---------------------------------------------------------------------
tools:
  # compound_loop:  'python sdd-toolkit/tools/compound_loop.py --tkt {tkt} --date {date}'
  # graph_query:    'python sdd-toolkit/tools/graph_viz.py --query "{query}"'
  # code_graph:     'python sdd-toolkit/tools/code_graph.py --query "{query}"'
  # impact_graph:   'python sdd-toolkit/tools/impact_graph.py --object "{object}" --format md'
  # enrich_graph:   'python sdd-toolkit/tools/enrich_graph.py'
  # verify:         'mcp'   # o comando/runner de verificación del profile

artifacts:
  - { name: _index.md,  generated_by: context-generator }
  - { name: spec.md,    generated_by: context-generator, template: ./sdd-toolkit/templates/spec.md }
  - { name: design.md,  generated_by: context-generator, template: ./sdd-toolkit/templates/design.md }
  - { name: impl.md,    generated_by: implementer,        template: ./sdd-toolkit/templates/impl.md }
  - { name: delta.md,   generated_by: context-generator, template: ./sdd-toolkit/templates/delta.md }
  - { name: release.md, generated_by: context-generator, template: ./sdd-toolkit/templates/release.md }

context_discipline:
  austero: always
  lean_context_at: 0.4

# ---------------------------------------------------------------------
# repo_setup — archivos de infraestructura que deben existir en el repo
# de contexto. El generador los verifica al inicio de sesión y los
# despliega si faltan (idempotente — nunca sobreescribe).
# Motivación: Cursor/Windows lee cp1252 por defecto; sin .editorconfig
# los archivos .md quedan en mojibake tras la primera edición.
# ---------------------------------------------------------------------
repo_setup:
  context_repo:
    - dest: .editorconfig
      src:  sdd-toolkit/setup/editorconfig
