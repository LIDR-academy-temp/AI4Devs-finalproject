paths:
  /groups/{groupId}/invitations:
    get:
      summary: The group's pending invitations that haven't expired, without their links. Members only (BR-12).
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: groupId
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCollection"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a member or buyer invitation that expires in 7 days, and get its link. Members only (BR-08, BR-12, BR-32).
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: groupId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{groupId}/lists:
    get:
      summary: The group's lists that aren't archived, for members and buyers (BR-12)
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: groupId
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCollection"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a list. Members only (BR-12).
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: groupId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups/{groupId}:
    get:
      summary: The group with its members and buyers. Members only (BR-12).
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: groupId
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /groups:
    get:
      summary: The groups the user belongs to, with their role in each
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/{invitationId}:
    delete:
      summary: Cancel a pending invitation, so its link stops working. Members of its group only (BR-08, BR-12).
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: invitationId
          in: path
      responses:
        "204":
          description: Success, with no content
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: INVITATION_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/by-code/{code}/accept:
    post:
      summary: "Accept an invitation: join its group with its type (BR-08, BR-09). Refused with ALREADY_IN_GROUP if the user already has that access."
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          required: true
          name: code
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitation"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: RULE_VIOLATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: INVITATION_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/by-code/{code}/decline:
    post:
      summary: Decline an invitation, which uses up its link; a user who has never had a membership then gets their own group and first list (BR-06, BR-08). Refused with ALREADY_IN_GROUP like accept.
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          required: true
          name: code
          in: path
      responses:
        "204":
          description: Success, with no content
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: RULE_VIOLATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: INVITATION_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /invitations/by-code/{code}:
    get:
      summary: "Invitation preview: inviter, group, and type, and, for a signed-in user, whether they already have the access it gives. No sign-in required (BR-08, BR-09)."
      security: []
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          required: true
          name: code
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: INVITATION_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /items/{itemId}/purchase:
    post:
      summary: Mark an item as purchased ("I bought it"), with an optional buyer note. Only the item's buyer, while it is reserved (FR-25, BR-12, BR-25).
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: itemId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          description: NOT_SIGNED_IN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: ITEM_CHANGED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: VALIDATION_FAILED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: INTERNAL_ERROR
          content:
            application/json:
