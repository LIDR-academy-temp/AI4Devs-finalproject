[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firmadoc-agent"
description = "Firmadoc Agent: firma hashes con el token del usuario por PKCS#11, escuchando solo en 127.0.0.1"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2"]

[tool.setuptools.dynamic]
version = { attr = "firmadoc_agent.__version__" }

[tool.setuptools.packages.find]
include = ["firmadoc_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
