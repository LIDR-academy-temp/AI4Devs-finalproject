<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>{{_ReportTitle}}</title>
    <style>
        body { font-family: Segoe UI, Arial, sans-serif; font-size: 12px; margin: {{_Margins}}; color: #1f2937; }
        .header { display: flex; justify-content: space-between; border-bottom: 1px solid #d1d5db; margin-bottom: 14px; padding-bottom: 8px; }
        .title { font-size: 18px; font-weight: 700; }
        .subtle { color: #6b7280; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #d1d5db; padding: 6px 8px; }
        th { background: #f3f4f6; text-align: left; }
        .page-note { margin-top: 14px; font-size: 11px; color: #6b7280; }
    </style>
    {{_EXTRA_STYLES_}}
</head>
<body>
    <div class="header">
        <div>
            <div class="title">{{_ReportTitle}}</div>
            <div class="subtle">Fraccionamiento CQ500</div>
        </div>
        <div class="subtle">
            Usuario: {{_UserName}}<br/>
            Fecha: {{_Date}} {{_Time}}
        </div>
    </div>
    {{_CONTENT_}}
    <div class="page-note">Total de registros: {{_TotalRows}}</div>
</body>
</html>
